services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: docslite
      POSTGRES_PASSWORD: docslite
      POSTGRES_DB: docslite
    ports:
      - "5432:5432"
    volumes:
      - docslite_pg_data:/var/lib/postgresql/data

volumes:
  docslite_pg_data:
